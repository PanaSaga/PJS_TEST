<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반응속도 측정 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="screen" class="screen screen--idle">
    <div class="panel panel--idle">
      <h1>반응속도 측정 게임</h1>
      <p class="desc">버튼을 누르면 게임이 시작됩니다.<br />화면이 빨간색으로 바뀌면 최대한 빨리 클릭하세요!</p>
      <button id="start-btn" type="button">게임 시작</button>
    </div>

    <div class="panel panel--waiting" hidden>
      <p class="big-text">곧 화면이 바뀝니다...</p>
      <p class="desc">아직 클릭하지 마세요!</p>
    </div>

    <div class="panel panel--ready" hidden>
      <p class="big-text">지금 클릭!</p>
    </div>

    <div class="panel panel--fail" hidden>
      <p class="big-text">실패!</p>
      <p class="desc">너무 일찍 클릭했습니다.</p>
      <button id="retry-btn" type="button">다시 시도</button>
    </div>

    <div class="panel panel--result" hidden>
      <p class="big-text"><span id="result-ms">0</span> ms</p>
      <form id="save-form">
        <input id="nickname-input" type="text" maxlength="12" placeholder="닉네임 입력" required />
        <button id="save-btn" type="submit">기록 저장</button>
      </form>
      <p id="save-status" class="save-status" hidden></p>
      <button id="restart-btn" type="button">다시 하기</button>

      <section class="ranking">
        <h2>랭킹 TOP 10</h2>
        <ol id="ranking-list"></ol>
      </section>
    </div>
  </main>

  <script type="module" src="js/game.js"></script>
</body>
</html>
